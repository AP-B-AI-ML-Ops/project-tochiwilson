services:
  database:
    build: ./backend-database
    restart: unless-stopped
    env_file:
      - ./backend-database/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "mlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  experiment-tracking:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlruns
    depends_on:
      database:
        condition: service_healthy

  orchestration:
    build: ./l3-backend-orchestration
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  train-deploy:
    build: ./l1-train-and-deploy
    profiles: ["training"]
    env_file:
      - .env
    volumes:
      - ./data:/data
      - mlflow-artifacts:/mlruns
    depends_on:
      experiment-tracking:
        condition: service_started
      orchestration:
        condition: service_healthy

  web-service:
    build: ./l2-web-service
    ports:
      - "9696:9696"
    env_file:
      - .env
    volumes:
      - mlflow-artifacts:/mlruns
    depends_on:
      - experiment-tracking

  batch-service:
    build: ./l4-batch-service
    env_file:
      - .env
    volumes:
      - ./data:/data
      - mlflow-artifacts:/mlruns
    depends_on:
      experiment-tracking:
        condition: service_started
      orchestration:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "3400:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - database

volumes:
  postgres-data:
  mlflow-artifacts:
  grafana-data:

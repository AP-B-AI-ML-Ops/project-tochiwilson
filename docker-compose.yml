services:
  experiment-tracking:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlruns
  
  orchestration:
    build: ./l3-backend-orchestration
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  train-deploy:
    build: ./l1-train-and-deploy
    profiles: ["training"]
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
      - PREFECT_API_URL=http://orchestration:4200/api
    volumes:
      - ./data:/data
      - mlflow-artifacts:/mlruns
    depends_on:
      - experiment-tracking

  web-service:
    build: ./l2-web-service
    ports:
      - "9696:9696"
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
    volumes:
      - mlflow-artifacts:/mlruns
    depends_on:
      - experiment-tracking

  batch-service:
    build: ./l4-batch-service
    profiles: ["batch"]
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
      - PREFECT_API_URL=http://orchestration:4200/api
    volumes:
      - ./data:/data
      - mlflow-artifacts:/mlruns
    depends_on:
      experiment-tracking:
        condition: service_started
      orchestration:
        condition: service_healthy

volumes:
  mlflow-artifacts: